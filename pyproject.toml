[project]
name = "self-improving-fleet"
version = "0.1.0"
description = "Self-improving speculative decoding fleet: live traffic -> async draft retraining -> versioned registry -> SLO-gated canary -> hot-swap"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.48",
    "accelerate>=1.3",
    "safetensors>=0.4",
    "numpy>=1.26",
    "scipy>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "tenacity>=9.0",
    "rich>=13.9",
    "typer>=0.15",
    "datasets>=3.2",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.45"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
